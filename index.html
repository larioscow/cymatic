<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cymatic</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #e9e7e2; overflow: hidden; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #1a1a18; }
  ::selection { background: #1a1a18; color: #e9e7e2; }
  input, button, textarea { font-family: inherit; color: inherit; }
  ::placeholder { color: rgba(26,26,24,.38); }
  input:focus, button:focus, textarea:focus { outline: none; }

  #app { position: fixed; inset: 0; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(125% 120% at 50% 45%, rgba(233,231,226,0) 55%, rgba(180,176,168,.35) 100%); }

  .pill { background: linear-gradient(140deg, rgba(255,252,246,.76), rgba(255,251,244,.64) 50%, rgba(255,252,246,.7)); backdrop-filter: blur(22px) saturate(1.7) brightness(1.04); -webkit-backdrop-filter: blur(22px) saturate(1.9) brightness(1.05); border: 1px solid rgba(255,255,255,.6); border-radius: 999px; box-shadow: 0 1px 2px rgba(40,38,34,.1), 0 10px 26px -14px rgba(40,38,34,.34), 0 30px 64px -30px rgba(40,38,34,.55), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.22), inset 0 -12px 22px -14px rgba(255,255,255,.5), inset 0 -1px 2px rgba(40,38,34,.06); }
  .iconbtn { flex: 0 0 auto; border-radius: 50%; border: 1px solid rgba(255,255,255,.55); background: radial-gradient(125% 125% at 30% 24%, rgba(255,253,248,.84), rgba(255,250,242,.66) 70%); backdrop-filter: blur(13px) saturate(1.7) brightness(1.05); -webkit-backdrop-filter: blur(13px) saturate(1.7) brightness(1.05); box-shadow: 0 1px 2px rgba(40,38,34,.12), 0 6px 16px -8px rgba(40,38,34,.45), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.2), inset 0 -6px 10px -7px rgba(255,255,255,.5); cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1a1a18; }
  .solidbtn { border: none; background: linear-gradient(180deg, rgba(46,46,42,.95), rgba(20,20,18,.96)); backdrop-filter: blur(8px) saturate(1.3); -webkit-backdrop-filter: blur(8px) saturate(1.3); color: #e9e7e2; box-shadow: 0 8px 20px -8px rgba(26,26,24,.6), 0 2px 6px -3px rgba(26,26,24,.5), inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 4px rgba(0,0,0,.35); }

  /* ---- prompt screen ---- */
  #prompt-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    opacity: 1; transform: scale(1); filter: blur(0); pointer-events: auto;
    transition: opacity .85s cubic-bezier(.65,0,.2,1), transform 1.05s cubic-bezier(.65,0,.2,1), filter .85s ease; }
  #app.gen #prompt-screen { opacity: 0; transform: scale(.97); filter: blur(7px); pointer-events: none; }

  #fileChip { display: none; justify-content: center; margin-bottom: 14px; }
  #fileChip.show { display: flex; }
  #fileChip .chip { display: flex; align-items: center; gap: 10px; background: linear-gradient(140deg, rgba(255,252,246,.72), rgba(255,250,242,.6) 60%, rgba(255,252,246,.66)); backdrop-filter: blur(18px) saturate(1.8) brightness(1.05); -webkit-backdrop-filter: blur(18px) saturate(1.8) brightness(1.05); border: 1px solid rgba(255,255,255,.55); border-radius: 999px; padding: 8px 10px 8px 16px; box-shadow: 0 1px 2px rgba(40,38,34,.1), 0 10px 30px -18px rgba(40,38,34,.5), inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.2), inset 0 -8px 14px -10px rgba(255,255,255,.45); }
  #fileChip .chip span { font-size: 12px; }
  #fileChip .chip button { background: none; border: none; cursor: pointer; color: rgba(26,26,24,.5); padding: 3px; display: flex; }

  #promptPill { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; backdrop-filter: blur(40px) saturate(1.9) brightness(1.05); -webkit-backdrop-filter: blur(40px) saturate(1.9) brightness(1.05); }
  #promptInput { flex: 1 1 auto; background: none; border: none; font-size: 16px; letter-spacing: .01em; padding: 12px 6px; min-width: 0; }

  /* ---- generate chrome ---- */
  #chrome { position: absolute; inset: 0; pointer-events: none; }
  #app.gen #chrome { pointer-events: none; }
  #topbar { position: absolute; top: 22px; left: 0; right: 0; display: flex; justify-content: center; padding: 0 22px; opacity: 0; transform: translateY(-130%); pointer-events: none; transition: opacity .9s ease, transform 1s cubic-bezier(.6,0,.2,1); }
  #botbar { position: absolute; bottom: 26px; left: 0; right: 0; display: flex; justify-content: center; padding: 0 22px; opacity: 0; transform: translateY(150%); pointer-events: none; transition: opacity .9s ease, transform 1s cubic-bezier(.6,0,.2,1); }
  #app.gen #topbar, #app.gen #botbar { opacity: 1; transform: translateY(0); pointer-events: auto; }

  #topPill { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 16px; padding: 9px 16px 9px 9px; }
  #scrub { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px; }
  #songTitle { flex: 0 1 auto; min-width: 0; font-size: 13.5px; font-weight: 500; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #time, #total { flex: 0 0 auto; font-size: 11px; letter-spacing: .05em; width: 40px; }
  #time { color: rgba(26,26,24,.7); text-align: right; }
  #total { color: rgba(26,26,24,.45); }
  #seek { flex: 1 1 auto; position: relative; height: 20px; display: flex; align-items: center; cursor: pointer; min-width: 60px; }
  #seek .track { position: absolute; left: 0; right: 0; height: 3px; border-radius: 3px; background: rgba(26,26,24,.18); }
  #fill { position: absolute; left: 0; width: 0%; height: 3px; border-radius: 3px; background: #1a1a18; }
  #handle { position: absolute; left: 0%; top: 50%; width: 11px; height: 11px; border-radius: 50%; background: #1a1a18; transform: translate(-50%,-50%); }
  #seek .mark { position: absolute; top: 50%; width: 2px; height: 11px; border-radius: 1px; background: #1a1a18; opacity: .55; transform: translate(-50%,-50%); pointer-events: none; }
  body[data-ground="dark"] #seek .mark { background: #fff; opacity: .6; }

  #botRow { width: 100%; max-width: 680px; display: flex; align-items: center; gap: 12px; }
  #botPill { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  #refineInput { flex: 1 1 auto; background: none; border: none; font-size: 14px; line-height: 1.45; letter-spacing: .01em; padding: 8px 0; min-width: 0; resize: none; overflow-y: auto; max-height: 78px; box-sizing: border-box; display: block; }
  /* active state = solid inverted button; reset the light-glass insets the base .iconbtn carries, else
     its bright white inner highlights bleed over the dark fill and read as a broken/glitchy ring. */
  .iconbtn.on { background: linear-gradient(180deg, rgba(46,46,42,.95), rgba(20,20,18,.96)); color: #e9e7e2; border: none; box-shadow: 0 6px 16px -8px rgba(40,38,34,.5), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 4px rgba(0,0,0,.32); }
  body[data-ground="dark"] .iconbtn.on { background: linear-gradient(180deg, rgba(246,243,235,.96), rgba(228,223,212,.95)); color: #08080a; border: none; box-shadow: 0 6px 16px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.12); }

  /* ---- saved-presets folder (popover anchored to the folder button) ---- */
  #folderWrap { position: relative; flex: 0 0 auto; }
  #presetPanel { position: absolute; bottom: calc(100% + 12px); right: 0; width: 300px; max-height: 320px; overflow-y: auto; display: none; flex-direction: column; gap: 2px; padding: 8px; border-radius: 18px; }
  #presetPanel.show { display: flex; }
  .preset-item { display: flex; align-items: center; gap: 4px; padding: 7px 6px 7px 10px; border-radius: 10px; cursor: pointer; }
  .preset-item:hover { background: color-mix(in srgb, currentColor 9%, transparent); }
  .preset-item .nm { flex: 1 1 auto; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset-item button { flex: 0 0 auto; background: none; border: none; cursor: pointer; color: inherit; opacity: .42; padding: 4px; display: flex; border-radius: 6px; }
  .preset-item button:hover { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
  .preset-rename { width: 100%; background: color-mix(in srgb, currentColor 10%, transparent); border: 1px solid color-mix(in srgb, currentColor 32%, transparent); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12px; color: inherit; }
  .preset-empty { font-size: 11px; opacity: .55; padding: 10px; line-height: 1.5; }

  /* ---- image drag-drop overlay ---- */
  #dropZone { position: fixed; inset: 18px; z-index: 30; display: none; align-items: center; justify-content: center; pointer-events: none;
    border: 2px dashed color-mix(in srgb, currentColor 45%, transparent); border-radius: 24px; background: color-mix(in srgb, currentColor 7%, transparent);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
  #dropZone.show { display: flex; }

  /* ---- hidden dev panel (press D) — plain monochrome, deliberately un-flashy ---- */
  #dev { position: absolute; right: 14px; top: 14px; z-index: 5; width: 340px; max-height: 88vh; overflow: auto; display: none; flex-direction: column; gap: 8px;
    background: rgba(20,20,20,.92); color: #d2d2d2; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 12px; backdrop-filter: blur(6px); font-size: 11px; }
  #dev.show { display: flex; }
  #dev .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #dev select { background: rgba(255,255,255,.06); color: #d2d2d2; border: 1px solid rgba(255,255,255,.16); border-radius: 5px; padding: 4px; font-family: inherit; }
  #dev .ptitle { font-size: 10px; letter-spacing: .14em; color: #8a8a8a; text-transform: uppercase; margin-top: 4px; }
  .knob { display: grid; grid-template-columns: 80px 1fr 30px; align-items: center; gap: 6px; }
  .knob span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .knob em { font-style: normal; color: #9a9a9a; text-align: right; }
  .knob input[type=range] { width: 100%; accent-color: #9a9a9a; }
  #devlog { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; font-size: 10px; line-height: 1.4; }
  #devlog:empty::after { content: 'logs appear here…'; opacity: .4; }
  #devlog .lg { white-space: pre-wrap; word-break: break-word; color: #b0b0b0; }
  #devlog .lg .t { opacity: .45; }
  #devlog .lg-warn { color: #d9c08a; }
  #devlog .lg-error { color: #d99090; }
  /* ---- Gemma inspector (under-the-hood reasoning trace) — plain monochrome ---- */
  #gemma { display: flex; flex-direction: column; gap: 7px; }
  #gemma .gempty { opacity: .45; font-size: 10px; padding: 2px 0 4px; }
  .gcall { border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 7px 8px; background: rgba(255,255,255,.03); display: flex; flex-direction: column; gap: 4px; }
  .gcall:first-of-type { border-color: rgba(255,255,255,.28); }  /* newest is brighter-bordered */
  .ghead { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .gmodel { color: #e0e0e0; font-weight: 600; }
  .gspeed { color: #a8a8a8; margin-left: auto; font-variant-numeric: tabular-nums; }
  .gkind { color: #8a8a8a; text-transform: uppercase; letter-spacing: .08em; font-size: 9px; border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 1px 4px; }
  .gprompt { color: #d8d8d8; font-size: 11px; opacity: .9; }
  .gstep { display: flex; flex-direction: column; gap: 3px; padding: 5px 0 2px; border-top: 1px solid rgba(255,255,255,.08); }
  .gsteprow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .glabel { color: #d2d2d2; font-weight: 600; font-size: 11px; }
  .gbadge { font-size: 9px; border-radius: 3px; padding: 1px 4px; white-space: nowrap; color: #9a9a9a; border: 1px solid rgba(255,255,255,.18); }
  .gmeta { color: #9a9a9a; font-size: 10px; font-variant-numeric: tabular-nums; }
  .gthought { color: #e8e8e8; font-size: 11px; line-height: 1.4; border-left: 2px solid rgba(255,255,255,.3); padding-left: 6px; }
  .gapproach { color: #aaa; font-size: 10px; line-height: 1.4; }
  .gdecide { color: #888; font-size: 10px; letter-spacing: .04em; }
  .graw { font-size: 10px; }
  .graw > summary { cursor: pointer; color: #9a9a9a; list-style: none; padding: 1px 0; }
  .graw > summary::-webkit-details-marker { display: none; }
  .graw[open] > summary { color: #cfcfcf; }
  .graw pre { margin: 2px 0 0; max-height: 180px; overflow: auto; background: rgba(0,0,0,.35); border-radius: 4px; padding: 6px; white-space: pre-wrap; word-break: break-word; color: #a8a8a8; font-size: 9.5px; line-height: 1.35; }
  /* ---- speed test (Cerebras vs GPU) ---- */
  #speedtest { display: flex; flex-direction: column; gap: 6px; }
  #speedBtn { align-self: flex-start; background: rgba(255,255,255,.08); color: #e6e6e6; border: 1px solid rgba(255,255,255,.22); border-radius: 6px; font: inherit; font-size: 11px; padding: 5px 11px; cursor: pointer; }
  #speedBtn:hover { background: rgba(255,255,255,.15); }
  #speedBtn:disabled { opacity: .5; cursor: default; }
  #speedResult { font-size: 11px; }
  #speedResult.stempty { opacity: .45; font-size: 10px; }
  .strow { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .stlabel { color: #cfcfcf; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stms { color: #f0f0f0; font-variant-numeric: tabular-nums; }
  .sttps { color: #9a9a9a; font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
  .sterr { color: #d99090; font-size: 10px; }
  .stsum { margin-top: 5px; color: #fff; font-weight: 600; font-size: 12px; }
  /* ---- "add a track" hint bubble (empty-state Enter) ---- */
  #addTrackHint { position: fixed; z-index: 40; transform: translate(-50%, -100%); padding: 9px 14px; border-radius: 12px;
    background: #1a1a18; color: #f3f1ec; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap;
    box-shadow: 0 10px 28px -10px rgba(40,38,34,.55); pointer-events: none; opacity: 0; visibility: hidden;
    transition: opacity .22s ease, transform .22s cubic-bezier(.5,1.6,.5,1); }
  #addTrackHint.show { opacity: 1; visibility: visible; transform: translate(-50%, calc(-100% - 8px)); }
  #addTrackHint::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 12px; height: 12px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  body[data-ground="dark"] #addTrackHint { background: #f6f3eb; color: #08080a; box-shadow: 0 10px 28px -10px rgba(0,0,0,.6); }
  #devhint { position: absolute; left: 14px; bottom: 8px; font-size: 9px; letter-spacing: .2em; color: rgba(26,26,24,.3); }
  #dirstat { position: absolute; right: 14px; bottom: 8px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: rgba(26,26,24,.42); opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #hud { position: absolute; right: 14px; bottom: 22px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(26,26,24,.5); font-variant-numeric: tabular-nums; pointer-events: none; }

  /* ---- dark-ground adaptation — dark-vibrancy glass + light ink; light theme untouched ---- */
  body[data-ground="dark"] { background: #08080a; color: #fff; }
  body[data-ground="dark"] ::placeholder { color: color-mix(in srgb, #fff 42%, transparent); }
  body[data-ground="dark"] ::selection { background: #fff; color: #08080a; }
  body[data-ground="dark"] .vignette { background: radial-gradient(125% 120% at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,.55) 100%); }

  body[data-ground="dark"] .pill { background: linear-gradient(140deg, rgba(22,22,27,.66), rgba(13,13,17,.56) 50%, rgba(22,22,27,.6)); backdrop-filter: blur(22px) saturate(1.25) brightness(0.82); -webkit-backdrop-filter: blur(22px) saturate(1.25) brightness(0.82); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 2px 8px rgba(0,0,0,.45), 0 28px 60px -28px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.34), inset 0 0 0 1px rgba(255,255,255,.05), inset 0 -12px 22px -16px rgba(255,255,255,.12); }
  body[data-ground="dark"] .iconbtn { color: #fff; background: radial-gradient(125% 125% at 30% 24%, rgba(42,42,48,.66), rgba(15,15,19,.6) 70%); backdrop-filter: blur(13px) saturate(1.25) brightness(0.85); -webkit-backdrop-filter: blur(13px) saturate(1.25) brightness(0.85); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.05), inset 0 -6px 10px -7px rgba(255,255,255,.14); }
  body[data-ground="dark"] #promptPill { backdrop-filter: blur(40px) saturate(1.25) brightness(0.82); -webkit-backdrop-filter: blur(40px) saturate(1.25) brightness(0.82); }
  body[data-ground="dark"] .solidbtn { background: linear-gradient(180deg, rgba(246,243,235,.96), rgba(228,223,212,.95)); color: #08080a; box-shadow: 0 8px 22px -8px rgba(0,0,0,.65), 0 2px 6px -3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 4px rgba(0,0,0,.12); }
  body[data-ground="dark"] #fileChip .chip { background: linear-gradient(140deg, rgba(22,22,27,.62), rgba(13,13,17,.54) 60%, rgba(22,22,27,.58)); backdrop-filter: blur(18px) saturate(1.25) brightness(0.85); -webkit-backdrop-filter: blur(18px) saturate(1.25) brightness(0.85); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 2px 8px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -8px 14px -10px rgba(255,255,255,.1); }

  body[data-ground="dark"] #time { color: color-mix(in srgb, #fff 72%, transparent); }
  body[data-ground="dark"] #total { color: color-mix(in srgb, #fff 45%, transparent); }
  body[data-ground="dark"] #seek .track { background: color-mix(in srgb, #fff 22%, transparent); }
  body[data-ground="dark"] #fill, body[data-ground="dark"] #handle { background: #fff; }
  body[data-ground="dark"] #fileChip .chip svg { stroke: #fff; }
  body[data-ground="dark"] #devhint { color: color-mix(in srgb, #fff 30%, transparent); }
  body[data-ground="dark"] #dirstat { color: color-mix(in srgb, #fff 42%, transparent); }
  body[data-ground="dark"] #hud { color: color-mix(in srgb, #fff 50%, transparent); }

  /* contrast safety net: keep text legible at the panels' translucent edges over any background */
  #promptInput, #refineInput, #songTitle, #time, #total { text-shadow: 0 1px 2px rgba(255,253,250,.45); }
  body[data-ground="dark"] #promptInput, body[data-ground="dark"] #refineInput, body[data-ground="dark"] #songTitle, body[data-ground="dark"] #time, body[data-ground="dark"] #total { text-shadow: 0 1px 3px rgba(0,0,0,.75); }
  /* ---- mobile ---- */
  @media (max-width: 640px) {
    #topbar { top: 12px; padding: 0 10px; }
    #topPill { flex-wrap: wrap; gap: 8px; row-gap: 9px; max-width: 100%; padding: 8px 10px; }
    #songTitle { flex: 1 1 auto; font-size: 12.5px; }
    #scrub { order: 9; flex: 1 1 100%; gap: 10px; }   /* full-width scrubber drops to its own row */
    #seek { height: 24px; }

    #botbar { bottom: 14px; padding: 0 10px; }
    #botRow { max-width: 100%; gap: 8px; align-items: flex-end; }
    #botPill { flex-wrap: wrap; row-gap: 8px; padding: 8px 14px; }
    #refineInput { flex: 1 1 100%; font-size: 15px; order: -1; }  /* input full width on top; dice + action buttons wrap beneath */

    #dev { width: calc(100vw - 24px); right: 12px; top: 12px; max-height: 72vh; }
    #devhint { display: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div class="vignette"></div>

    <!-- PROMPT SCREEN -->
    <div id="prompt-screen">
      <div style="width:100%;max-width:880px;padding:0 24px;">
        <div id="fileChip">
          <div class="chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1a1a18" stroke-width="1.5"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
            <span id="fileName"></span>
            <button id="clearFile"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
        <div id="promptPill" class="pill">
          <button id="pickBtn" class="iconbtn" title="Attach a track" style="width:46px;height:46px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
          </button>
          <input id="promptInput" placeholder="Describe the visuals…" autocomplete="off" />
          <button id="genBtn" class="iconbtn solidbtn" title="Enter" style="width:46px;height:46px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <input id="file" type="file" accept="audio/*" style="display:none;" />
    </div>
    <div id="addTrackHint">Add an audio track, it’s worth it ;)</div>

    <!-- GENERATE CHROME -->
    <div id="chrome">
      <div id="topbar"><div id="topPill" class="pill">
        <button id="resetBtn" class="iconbtn" title="New" style="width:40px;height:40px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <div id="songTitle">UNTITLED SESSION</div>
        <button id="playBtn" class="iconbtn solidbtn" style="width:42px;height:42px;">
          <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        </button>
        <div id="scrub">
          <div id="time">0:00</div>
          <div id="seek"><div class="track"></div><div id="fill"></div><div id="handle"></div></div>
          <div id="total">0:00</div>
        </div>
        <button id="loopBtn" class="iconbtn" title="Loop the track" style="width:36px;height:36px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button id="fsBtn" class="iconbtn" title="Fullscreen" style="width:36px;height:36px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div></div>
      <div id="botbar"><div id="botRow">
        <div id="botPill" class="pill">
          <button id="diceBtn" class="iconbtn" title="Surprise me · a hand-picked prompt" style="width:38px;height:38px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.25" fill="currentColor" stroke="none"/></svg>
          </button>
          <textarea id="refineInput" rows="1" placeholder="Steer the visuals…" autocomplete="off"></textarea>
          <button id="imgBtn" class="iconbtn" title="Theme from a reference image" style="width:38px;height:38px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-4 4"/></svg>
          </button>
          <button id="rerollBtn" class="iconbtn" title="Re-roll — a fresh take on the same prompt" style="width:38px;height:38px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          </button>
          <button id="autoBtn" class="iconbtn" title="Auto-VJ — regenerate on each song section (Automatic)" style="width:38px;height:38px;font-size:16px;font-weight:600;line-height:1;">A</button>
          <button id="saveBtn" class="iconbtn" title="Save the current visual as a preset" style="width:38px;height:38px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.8l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85z"/></svg>
          </button>
        </div>
        <div id="folderWrap">
          <div id="presetPanel" class="pill"></div>
          <button id="folderBtn" class="iconbtn" title="Saved presets" style="width:52px;height:52px;border-radius:18px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
        </div>
      </div></div>
    </div>

    <!-- DEV PANEL (press D) -->
    <div id="dev">
      <!-- theme/director selectors removed from the dev window; kept hidden so the compose pipeline (always 'compose') still resolves them -->
      <div hidden><select id="themeSel"></select><select id="providerSel"><option value="compose" selected>compose</option></select></div>
      <div id="speedtest">
        <div class="ptitle">Cerebras vs GPU</div>
        <button id="speedBtn">Run speed test</button>
        <div id="speedResult" class="stempty">same prompt, Cerebras Gemma vs a GPU provider</div>
      </div>
      <div id="gemma"></div>
      <div id="panel"></div>
      <div class="row" style="margin-top:4px;"><span class="ptitle" style="margin:0;">logs</span><button id="logClear" style="background:rgba(255,255,255,.06);color:#cfcfcf;border:1px solid rgba(255,255,255,.18);border-radius:5px;font-size:10px;padding:2px 7px;cursor:pointer;">clear</button></div>
      <div id="devlog"></div>
    </div>
    <div id="devhint">PRESS D FOR DEV</div>
    <div id="dirstat"></div>
    <div id="hud"></div>
    <div id="dropZone">Drop an image to theme from it</div>
    <input id="imgFile" type="file" accept="image/*" style="display:none;" />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
